[project]
name = "dualfire-art-pipeline"
version = "0.1.0"
description = "Image-only pixel art pipeline for DualFire"
requires-python = ">=3.11,<3.14"
dependencies = [
    "httpx>=0.28,<0.29",
    "Pillow>=11,<13",
    "PyYAML>=6,<7",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
dualfire-art = "dualfire_art.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["dualfire_art"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
