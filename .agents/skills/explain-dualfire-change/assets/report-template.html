<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{TITLE}}</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0d1117;
      --surface: #161b22;
      --surface-2: #1f2630;
      --border: #30363d;
      --text: #e6edf3;
      --muted: #9da7b3;
      --accent: #58a6ff;
      --green: #3fb950;
      --yellow: #d29922;
      --red: #f85149;
      --purple: #bc8cff;
    }
    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      background: radial-gradient(circle at 85% 0, #18233a 0, var(--bg) 36rem);
      color: var(--text);
      font: 16px/1.65 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    a { color: var(--accent); }
    code { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; overflow-wrap: anywhere; }
    header, main, footer { width: min(1080px, calc(100% - 32px)); margin-inline: auto; }
    header { padding: 72px 0 34px; }
    .eyebrow { color: var(--accent); font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
    h1 { margin: 8px 0 12px; font-size: clamp(2rem, 6vw, 4.25rem); line-height: 1.05; letter-spacing: -.04em; }
    h2 { margin: 0 0 18px; font-size: clamp(1.5rem, 3vw, 2.2rem); }
    h3 { margin: 0 0 8px; }
    .meta { color: var(--muted); display: flex; gap: 12px; flex-wrap: wrap; }
    .scope { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 8px; margin-top: 26px; }
    .scope div { border: 1px solid var(--border); background: rgb(22 27 34 / .8); border-radius: 12px; padding: 12px 14px; }
    .scope dt { color: var(--muted); font-size: .78rem; text-transform: uppercase; }
    .scope dd { margin: 2px 0 0; overflow-wrap: anywhere; }
    nav { position: sticky; top: 0; z-index: 10; background: rgb(13 17 23 / .88); backdrop-filter: blur(14px); border-block: 1px solid var(--border); }
    nav div { width: min(1080px, calc(100% - 32px)); margin: auto; display: flex; gap: 18px; overflow-x: auto; padding: 11px 0; }
    nav a { white-space: nowrap; color: var(--muted); text-decoration: none; font-size: .9rem; }
    nav a:hover { color: var(--text); }
    section { padding: 52px 0; border-bottom: 1px solid var(--border); }
    .panel, .change-card, .risk { background: linear-gradient(145deg, var(--surface), #121821); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin: 14px 0; }
    .panel p:last-child, .change-card p:last-child, .risk p:last-child { margin-bottom: 0; }
    .change-meta { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .adapter { color: var(--muted); font-family: ui-monospace, SFMono-Regular, Consolas, monospace; font-size: .85rem; }
    .badge, .status { display: inline-flex; border: 1px solid var(--border); border-radius: 999px; padding: 2px 9px; font-size: .75rem; font-weight: 700; text-transform: uppercase; }
    .confidence-observed, .status-passed { color: var(--green); }
    .confidence-inferred, .status-not_run { color: var(--yellow); }
    .confidence-unknown, .status-failed { color: var(--red); }
    .flow { list-style: none; padding: 0; display: grid; gap: 10px; }
    .flow li { display: flex; align-items: center; gap: 12px; }
    .step-index { flex: 0 0 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; color: #08111f; background: var(--accent); font-weight: 800; }
    details { border-top: 1px solid var(--border); margin-top: 16px; padding-top: 12px; }
    summary { cursor: pointer; color: var(--muted); }
    .sources { color: var(--muted); }
    .risk { border-left-width: 4px; }
    .risk-low { border-left-color: var(--green); }
    .risk-medium { border-left-color: var(--yellow); }
    .risk-high { border-left-color: var(--red); }
    .risk div { display: flex; align-items: center; gap: 10px; }
    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; background: var(--surface); }
    th, td { border: 1px solid var(--border); padding: 12px; text-align: left; vertical-align: top; }
    th { background: var(--surface-2); }
    .quiz-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 20px; margin: 14px 0; }
    .quiz-options { display: grid; gap: 8px; margin: 14px 0; }
    .quiz-options label { display: flex; gap: 10px; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; cursor: pointer; }
    .quiz-options label:hover { background: var(--surface-2); }
    button { border: 0; border-radius: 9px; background: var(--accent); color: #07101d; padding: 9px 14px; font: inherit; font-weight: 800; cursor: pointer; }
    .quiz-result { min-height: 1.6em; margin-top: 10px; color: var(--muted); }
    .quiz-result.correct { color: var(--green); }
    .quiz-result.incorrect { color: var(--red); }
    footer { color: var(--muted); padding: 32px 0 52px; }
    @media (max-width: 640px) {
      header { padding-top: 48px; }
      section { padding: 38px 0; }
      .panel, .change-card, .risk, .quiz-card { padding: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <div class="eyebrow">{{PROJECT}} · {{MODE}} explanation</div>
    <h1>{{TITLE}}</h1>
    <div class="meta"><span>Generated {{GENERATED_AT}}</span></div>
    <dl class="scope">{{SCOPE}}</dl>
  </header>
  <nav aria-label="Report sections">
    <div>
      <a href="#summary">Summary</a>
      <a href="#background">Background</a>
      <a href="#intuition">Intuition</a>
      <a href="#flows">Flow</a>
      <a href="#changes">Changes</a>
      <a href="#risks">Risks</a>
      <a href="#verification">Verification</a>
      <a href="#limitations">Limitations</a>
      <a href="#quiz">Quiz</a>
    </div>
  </nav>
  <main>{{CONTENT}}</main>
  <footer>Generated by the project-local $explain-dualfire-change skill.</footer>
  <script type="application/json" id="quiz-data">{{QUIZ_JSON}}</script>
  <script>
    (() => {
      const root = document.getElementById("quiz-root");
      if (!root) return;
      const questions = JSON.parse(document.getElementById("quiz-data").textContent);
      questions.forEach((item, questionIndex) => {
        const card = document.createElement("article");
        card.className = "quiz-card";
        const title = document.createElement("h3");
        title.textContent = `${questionIndex + 1}. ${item.question}`;
        card.appendChild(title);
        const options = document.createElement("div");
        options.className = "quiz-options";
        item.options.forEach((option, optionIndex) => {
          const label = document.createElement("label");
          const input = document.createElement("input");
          input.type = "radio";
          input.name = `question-${questionIndex}`;
          input.value = String(optionIndex);
          const text = document.createElement("span");
          text.textContent = option;
          label.append(input, text);
          options.appendChild(label);
        });
        card.appendChild(options);
        const button = document.createElement("button");
        button.type = "button";
        button.textContent = "Check answer";
        const result = document.createElement("div");
        result.className = "quiz-result";
        button.addEventListener("click", () => {
          const selected = card.querySelector("input:checked");
          if (!selected) {
            result.className = "quiz-result incorrect";
            result.textContent = "Choose an answer first.";
            return;
          }
          const correct = Number(selected.value) === item.answer_index;
          result.className = `quiz-result ${correct ? "correct" : "incorrect"}`;
          result.textContent = `${correct ? "Correct." : "Not yet."} ${item.explanation}`;
        });
        card.append(button, result);
        root.appendChild(card);
      });
    })();
  </script>
</body>
</html>
